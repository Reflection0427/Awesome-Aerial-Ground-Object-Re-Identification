name: Test paper tracker

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'assets/frameworks/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'requirements.txt'
      - 'config/paper-tracker.json'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'assets/frameworks/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'requirements.txt'
      - 'config/paper-tracker.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate configuration and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m json.tool config/paper-tracker.json >/dev/null
          python -m json.tool data/frameworks.json >/dev/null
          python -m json.tool data/datasets.json >/dev/null
          python -m unittest discover -s tests -v
          python scripts/update_readmes.py --check

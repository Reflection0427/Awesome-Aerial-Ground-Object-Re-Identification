name: Test paper tracker

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/paper-tracker.json'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/paper-tracker.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration and run tests
        run: |
          python -m json.tool config/paper-tracker.json >/dev/null
          python -m unittest discover -s tests -v
